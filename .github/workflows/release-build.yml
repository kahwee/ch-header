name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Test immutable release asset recovery
        run: python3 scripts/test_release_assets.py -v

      - name: Validate release version
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag and package version differ")'
      - run: pnpm install --frozen-lockfile
      # Keep the pnpm check gate: independent source checks, then ordered builds.
      - parallel:
          - name: Formatting and lint
            run: pnpm format:check && pnpm lint
          - name: Type check
            run: pnpm typecheck
          - name: Tests with coverage
            run: pnpm test:coverage
          - name: Header echo tests
            run: pnpm test:echo
      - name: Build extension and Storybook
        run: pnpm build:package && pnpm storybook:build
      - name: Publish versioned archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp dist/*.zip dist/*.sha256 release/
          python3 scripts/release-assets.py "$GITHUB_REF_NAME" release --title "ChHeader $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
