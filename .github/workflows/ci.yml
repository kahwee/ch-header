name: ChHeader CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test immutable release asset recovery
        run: python3 scripts/test_release_assets.py -v
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: test ! -e package-lock.json
      - run: pnpm install --frozen-lockfile
      # Keep the pnpm check gate: independent source checks, then ordered builds.
      - parallel:
          - name: Formatting and lint
            run: pnpm format:check && pnpm lint
          - name: Type check
            run: pnpm typecheck
          - name: Tests with coverage
            run: pnpm test:coverage
          - name: Header echo tests
            run: pnpm test:echo
      - name: Build extension and Storybook
        run: pnpm build:package && pnpm storybook:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-and-coverage
          path: |
            dist/*.zip
            dist/*.sha256
            coverage/
          if-no-files-found: error
          retention-days: 14
